[project]
name = "crewops"
version = "0.1.0"
description = "Extroc: a conversational decision aid for an airline Crew Control desk"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # Agent
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=1.6.1",
    # One provider per package, all behind agent/providers.py. The graph only
    # ever sees a BaseChatModel, so which of these is live is a config choice.
    "langchain-anthropic>=1.7.1",
    "langchain-openai>=1.1.0",
    "langchain-ollama>=1.1.0",
    "anthropic>=1.3.0",
    # Types and IO
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.1.0",
    # HTTP
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.10",
    "httpx>=0.28.0",
    "websockets>=15,<17",
    # Terminal interface
    "typer>=0.16.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "mypy>=1.16.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
crewops = "crewops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `llm` is excluded by default. Those tests call a live provider, so they cost
# time and money and are not reproducible run to run. `make test` must stay
# offline and free: rule 6. Run them deliberately with `pytest -m llm`, which
# overrides this because a command line -m wins over addopts.
addopts = "-q --strict-markers -m 'not llm'"
markers = [
    "golden: parity against the shipped answer keys",
    "heldout: uses gitignored judging material, skips when absent",
    "llm: needs a configured model provider, skips when none is set",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]
# ANN401: `Any` is deliberate on the tool boundary, where payload shapes vary.
# UP042: `class X(str, Enum)` is kept over `StrEnum` on purpose. Under StrEnum,
#   f"{member}" renders the value rather than "Class.MEMBER", which would
#   silently change strings that reach a controller and that the grounding
#   verifier attests. The explicit `.value` style is what the codebase reads
#   against, so the mechanical rewrite is not worth the behaviour change.
ignore = ["ANN401", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# RUF001/2/3 flag ambiguous Unicode. These two files are *about* ambiguous
# Unicode: the fold table maps it, and the tests assert the extractor survives
# it. The characters have to be present literally or neither is testing
# anything. Everywhere else the rule stays on.
"src/crewops/verify/extract.py" = ["RUF001", "RUF002", "RUF003"]
"tests/verify/test_typography.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "The deterministic core must not import a model client. Agent code only."
"langchain_anthropic".msg = "The deterministic core must not import a model client. Agent code only."
"langchain_openai".msg = "The deterministic core must not import a model client. Agent code only."
"langchain_ollama".msg = "The deterministic core must not import a model client. Agent code only."
"openai".msg = "The deterministic core must not import a model client. Agent code only."
"ollama".msg = "The deterministic core must not import a model client. Agent code only."

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["crewops"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "langchain_anthropic.*"]
ignore_missing_imports = true
