[project]
name = "crewops"
version = "0.1.0"
description = "Crew Ops Advisor: a conversational decision aid for an airline Crew Control desk"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # Agent
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=1.6.1",
    "langchain-anthropic>=1.7.1",
    "anthropic>=1.3.0",
    # Types and IO
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.1.0",
    # HTTP
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.10",
    # Terminal interface
    "typer>=0.16.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "mypy>=1.16.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
crewops = "crewops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "golden: parity against the shipped answer keys",
    "heldout: uses gitignored judging material, skips when absent",
    "llm: needs ANTHROPIC_API_KEY, skips when absent",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "The deterministic core must not import a model client. Agent code only."
"langchain_anthropic".msg = "The deterministic core must not import a model client. Agent code only."

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["crewops"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "langchain_anthropic.*"]
ignore_missing_imports = true
